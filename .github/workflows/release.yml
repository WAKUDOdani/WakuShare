name: Release Windows
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Verify tag
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw new Error('Tag/version mismatch')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Build Windows installer and portable
        run: pnpm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged app and update metadata
        run: pnpm run verify:package
        env:
          WAKUSHARE_REQUIRE_INSTALLER: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: wakushare-windows
          path: |
            dist/WakuShare-*.exe
            dist/WakuShare-*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/package-verification.json
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wakushare-windows
          path: release
      - name: Create release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "WakuShare $GITHUB_REF_NAME" --generate-notes

name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string
permissions:
  # GitHub exposes draft release assets only to callers with push access.
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Verify tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "const {execFileSync}=require('node:child_process'); const tag=process.env.RELEASE_TAG; if(!/^v\d+\.\d+\.\d+$/.test(tag)||tag!=='v'+require('./package.json').version)throw Error('Tag/version mismatch'); const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim(); const sha=git('rev-parse','HEAD'); if(sha!==git('rev-parse',tag+'^{}'))throw Error('Checkout/tag mismatch'); console.log('WAKUSHARE_RELEASE_SOURCE='+sha)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Build Windows installer and portable
        run: pnpm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged app and update metadata
        run: pnpm run verify:package
        env:
          WAKUSHARE_REQUIRE_INSTALLER: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: wakushare-windows
          path: |
            dist/WakuShare-*.exe
            dist/WakuShare-*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/package-verification.json
          if-no-files-found: error
  # The maintainer publishes the already accepted local binaries after this
  # independent build succeeds. Do not replace them with another build's bytes
  # or create a second draft. The pinned runtime is uploaded to the draft first.

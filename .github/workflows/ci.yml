name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Canonicalize Windows temporary directory
        # Hosted Windows may expose TEMP as RUNNER~1 while fs.realpath returns
        # runneradmin. Use one spelling for fixture paths and actual paths.
        shell: pwsh
        run: |
          $canonicalTemp = node -p 'require("node:fs").realpathSync(require("node:os").tmpdir())'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Windows temp directory' }
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm run lint
      - run: pnpm run typecheck
      # The real Windows volume probe permits 10s; a cold runner needs headroom.
      - run: pnpm test --testTimeout=15000
      - run: pnpm exec electron-vite build

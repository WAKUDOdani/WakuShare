appId: io.github.wakudodani.wakushare
productName: WakuShare
copyright: Copyright © 2026 WAKUDO Dani; based on CapShare © Ilyasse Salama
directories:
  buildResources: build
publish:
  provider: github
  owner: WAKUDOdani
  repo: WakuShare
  releaseType: draft
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: LICENSE
    to: LICENSE-WakuShare.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asarUnpack:
  - resources/**
fileAssociations:
  - ext: capshare
    name: CapShare Project
    description: Portable CapCut project bundle
    mimeType: application/x-capshare
    role: Editor
win:
  executableName: WakuShare
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: WakuShare-${version}-setup-${arch}.${ext}
  shortcutName: WakuShare
  uninstallDisplayName: WakuShare
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
portable:
  artifactName: WakuShare-${version}-portable-${arch}.${ext}
npmRebuild: false
